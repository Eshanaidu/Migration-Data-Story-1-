<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Invisible Workforce — Interstate Labor Migration in India</title>
<meta name="description" content="A data story on interstate labor migration in India, built from Census 2011 and NITI Aayog data.">
<style>
/* =========================================================================
   THE INVISIBLE WORKFORCE — Design System
   Deep slate / midnight indigo base, warm amber accent, editorial serif +
   sans pairing. Built for a single, long scroll — restraint over decoration.
   ========================================================================= */

@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg-void:      #0b1120;
  --bg-panel:     #0f172a;
  --bg-raised:    #1a2436;
  --border:       #263145;
  --border-soft:  rgba(148, 163, 184, 0.14);

  --ink-hi:       #f1f5f9;
  --ink-mid:      #94a3b8;
  --ink-low:      #64748b;

  --amber:        #f59e0b;
  --amber-bright: #fbbf24;
  --amber-deep:   #d97706;

  --female:       #fb7185;
  --female-deep:  #f43f5e;
  --male:         #38bdf8;
  --male-deep:    #6366f1;
  --neutral:      #14b8a6;
  --neutral-soft: #94a3b8;

  --serif: 'Newsreader', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  --max-w: 780px;
  --max-w-wide: 1040px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

body {
  background: var(--bg-void);
  color: var(--ink-hi);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--amber); color: var(--bg-void); }

a { color: var(--amber-bright); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 3px;
}

/* ---------- Progress bar ---------- */
#progress-bar {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  width: 0%;
  background: linear-gradient(90deg, var(--amber-deep), var(--amber-bright));
  z-index: 1000;
  transition: width 0.1s linear;
}

/* ---------- Top nav ---------- */
.topnav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: rgba(11, 17, 32, 0.82);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-soft);
  font-size: 13px;
}

.topnav .title {
  font-family: var(--serif);
  font-size: 15px;
  color: var(--ink-hi);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 46vw;
}

.topnav .jumplinks {
  display: flex;
  gap: 18px;
}

.topnav .jumplinks button {
  background: none;
  border: none;
  color: var(--ink-mid);
  font-family: var(--sans);
  font-size: 13px;
  cursor: pointer;
  padding: 4px 2px;
  border-bottom: 2px solid transparent;
  transition: color 0.15s;
}

.topnav .jumplinks button:hover,
.topnav .jumplinks button.active {
  color: var(--amber-bright);
  border-bottom-color: var(--amber);
}

@media (max-width: 760px) {
  .topnav .jumplinks { display: none; }
}

/* ---------- Section shell ---------- */
section {
  padding: 120px 28px;
  max-width: var(--max-w);
  margin: 0 auto;
  scroll-margin-top: 70px;
}

section.wide { max-width: var(--max-w-wide); }

.section-eyebrow {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--amber-bright);
  font-weight: 600;
  margin-bottom: 14px;
}

.section-heading {
  font-family: var(--serif);
  font-size: clamp(28px, 4vw, 40px);
  font-weight: 500;
  line-height: 1.2;
  color: var(--ink-hi);
  margin-bottom: 20px;
  max-width: 640px;
}

.section-lede {
  font-size: 17px;
  color: var(--ink-mid);
  max-width: 620px;
  margin-bottom: 44px;
}

/* ---------- Reveal-on-scroll ---------- */
.reveal {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal.in-view { opacity: 1; transform: translateY(0); }

/* ---------- HERO (Section 1) ---------- */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  max-width: var(--max-w-wide);
  padding-top: 100px;
  padding-bottom: 60px;
}

.hero .kicker {
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: 0.02em;
  color: var(--ink-low);
  margin-bottom: 24px;
}

.hero h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(38px, 6.4vw, 76px);
  line-height: 1.06;
  color: var(--ink-hi);
  max-width: 920px;
}

.hero h1 .num {
  color: var(--amber-bright);
}

.hero .sub {
  margin-top: 28px;
  font-size: 19px;
  color: var(--ink-mid);
  max-width: 560px;
  line-height: 1.55;
}

.hero .scrolldown {
  margin-top: 64px;
  font-size: 13px;
  color: var(--ink-low);
  display: flex;
  align-items: center;
  gap: 10px;
}

.hero .scrolldown .line {
  width: 28px;
  height: 1px;
  background: var(--ink-low);
  animation: pulse-line 2s ease-in-out infinite;
}

@keyframes pulse-line {
  0%, 100% { width: 28px; opacity: 0.5; }
  50% { width: 40px; opacity: 1; }
}

/* ---------- Concept badge (data-anchored, not just a label) ---------- */
.concept-badge {
  border: 1px solid var(--border);
  background: var(--bg-raised);
  border-radius: 10px;
  padding: 18px 22px;
  margin: 40px 0;
  max-width: var(--max-w);
}

.concept-badge .concept-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--amber-bright);
  margin-bottom: 8px;
}

.concept-badge p {
  font-size: 15px;
  color: var(--ink-mid);
  line-height: 1.55;
}

.concept-badge strong { color: var(--ink-hi); font-weight: 600; }

/* ---------- Stat cards ---------- */
.stat-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin: 40px 0;
}

@media (max-width: 640px) {
  .stat-cards { grid-template-columns: 1fr; }
}

.stat-card {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 26px;
}

.stat-card .stat-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-low);
  margin-bottom: 10px;
}

.stat-card.female { border-top: 2px solid var(--female-deep); }
.stat-card.male { border-top: 2px solid var(--male-deep); }

.stat-card .stat-num {
  font-family: var(--serif);
  font-size: 40px;
  color: var(--ink-hi);
  line-height: 1;
  margin-bottom: 10px;
}

.stat-card.female .stat-num { color: var(--female); }
.stat-card.male .stat-num { color: var(--male); }

.stat-card p {
  font-size: 14px;
  color: var(--ink-mid);
  line-height: 1.5;
}

/* ---------- Chart wrapper ---------- */
.chart-wrap {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 28px 24px 20px;
  margin: 36px 0;
}

.chart-wrap .chart-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-hi);
  margin-bottom: 4px;
}

.chart-wrap .chart-sub {
  font-size: 12px;
  color: var(--ink-low);
  margin-bottom: 18px;
}

.chart-canvas-box {
  position: relative;
  width: 100%;
}

.chart-canvas-box.h-320 { height: 320px; }
.chart-canvas-box.h-260 { height: 260px; }
.chart-canvas-box.h-380 { height: 380px; }

.chart-source {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border-soft);
  font-size: 11.5px;
  color: var(--ink-low);
}

.chart-source a { color: var(--ink-low); text-decoration: underline; }
.chart-source a:hover { color: var(--amber-bright); }

/* ---------- Two-up chart grid ---------- */
.chart-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

@media (max-width: 760px) {
  .chart-grid-2 { grid-template-columns: 1fr; }
}

/* ---------- Callout ---------- */
.callout {
  border-left: 3px solid var(--amber);
  padding: 4px 0 4px 22px;
  margin: 32px 0;
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.5;
  color: var(--ink-hi);
  max-width: 640px;
}

.callout .fig { color: var(--amber-bright); }

/* ---------- Body copy ---------- */
.prose p {
  font-size: 16px;
  color: var(--ink-mid);
  max-width: 620px;
  margin-bottom: 18px;
}

.prose strong { color: var(--ink-hi); font-weight: 600; }

/* ---------- Section 6 case study header stats ---------- */
.case-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin: 32px 0 40px;
}

@media (max-width: 700px) {
  .case-stats { grid-template-columns: 1fr; }
}

.case-stat {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  text-align: left;
}

.case-stat .n {
  font-family: var(--serif);
  font-size: 28px;
  color: var(--amber-bright);
  margin-bottom: 6px;
}

.case-stat .l {
  font-size: 12.5px;
  color: var(--ink-mid);
  line-height: 1.4;
}

/* ---------- Town explorer ---------- */
.explorer-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
  align-items: center;
}

.explorer-controls label {
  font-size: 12.5px;
  color: var(--ink-low);
  margin-right: 4px;
}

.sort-btn {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  color: var(--ink-mid);
  font-family: var(--sans);
  font-size: 12.5px;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

.sort-btn:hover { color: var(--ink-hi); border-color: var(--amber-deep); }
.sort-btn.active {
  color: var(--bg-void);
  background: var(--amber-bright);
  border-color: var(--amber-bright);
  font-weight: 600;
}

.town-note {
  font-size: 12.5px;
  color: var(--ink-low);
  margin-bottom: 20px;
  max-width: 560px;
}

.town-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.town-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 90px;
  gap: 14px;
  align-items: center;
  padding: 14px 16px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}

.town-row:hover { border-color: var(--amber-deep); background: var(--bg-raised); }
.town-row.expanded { border-color: var(--amber); background: var(--bg-raised); }

@media (max-width: 640px) {
  .town-row { grid-template-columns: 1fr; gap: 6px; }
}

.town-row .t-name {
  font-size: 14px;
  color: var(--ink-hi);
  font-weight: 500;
}

.town-row .t-metric {
  font-size: 13px;
  color: var(--ink-mid);
}

.town-row .t-metric .v { color: var(--ink-hi); font-variant-numeric: tabular-nums; }

.gap-bar-track {
  position: relative;
  height
